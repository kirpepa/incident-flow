name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.25.13

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Unit and race tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build binaries
        run: go build ./cmd/...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Validate Compose file
        run: docker compose config --quiet
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.51.2 lint api/openapi.yaml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Failure-path integration test
        run: go test -count=1 -tags=integration -v ./tests/integration
      - name: Build container images
        run: docker compose build api worker mcp migrate seed
